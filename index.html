<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Ambassador Certificate</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Montserrat:wght@400;500&family=Poppins:wght@400;600&family=Roboto:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --orange: #fb5010; --bar: #ff5214; --white: #fff; --muted: #a9a9a9; --card: #0d0d0d; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; }
  body {
    color: var(--white); font-family: "Montserrat", system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh; overflow-x: hidden; position: relative;
  }

  /* Ambient glow behind the welcome card */
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 38%, rgba(251,80,16,.22), transparent 55%);
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .55; } }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; height: 18px; background: var(--bar); z-index: 1; }

  /* ---------- Welcome pop-up ---------- */
  #welcome {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px 16px 40px; z-index: 5;
    transition: opacity .45s ease, transform .45s ease;
  }
  #welcome.leave { opacity: 0; transform: scale(.9); pointer-events: none; }
  .card {
    width: min(440px, 100%); background: var(--card); border: 1px solid #262626; border-top: 4px solid var(--orange);
    border-radius: 14px; padding: 30px 24px 26px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.7), 0 0 60px rgba(251,80,16,.15);
    animation: pop .6s cubic-bezier(.2,1.4,.4,1) both .15s;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(24px) scale(.8); } to { opacity: 1; transform: none; } }
  .logo { width: 78%; max-width: 300px; height: auto; display: block; margin: 0 auto 22px; }
  .congrats { font-family: "Bebas Neue", sans-serif; color: var(--orange); font-size: clamp(38px, 11vw, 54px);
              line-height: .95; letter-spacing: .02em; }
  .lead { color: #ddd; font-size: 14px; line-height: 1.55; margin: 12px auto 24px; max-width: 320px; }
  label { display: block; font-family: "Bebas Neue", sans-serif; color: var(--muted); font-size: 17px; letter-spacing: .08em; }
  input {
    width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--orange); outline: none;
    color: var(--white); text-align: center; padding: 6px 4px 8px;
    font-family: "Great Vibes", cursive; font-size: 40px; line-height: 1.25;
  }
  input::placeholder { color: #4a4a4a; }
  .hint { min-height: 18px; font-size: 12px; color: var(--orange); margin-top: 8px; }
  .btn {
    font-family: "Bebas Neue", sans-serif; font-size: 24px; letter-spacing: .05em; cursor: pointer;
    background: var(--orange); color: #000; border: 2px solid var(--orange); border-radius: 6px;
    padding: 12px 26px 9px; margin-top: 14px; width: 100%; transition: transform .12s, filter .12s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--orange); }

  /* ---------- Reveal stage ---------- */
  #stage {
    position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 16px 60px; text-align: center;
  }
  #stage.show { display: flex; }
  .spot {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0;
    background:
      radial-gradient(ellipse 60% 48% at 50% 44%, rgba(255,240,220,.20), rgba(255,240,220,.06) 45%, transparent 70%),
      conic-gradient(from 180deg at 50% -10%, transparent 165deg, rgba(255,235,210,.10) 175deg, rgba(255,235,210,.16) 180deg, rgba(255,235,210,.10) 185deg, transparent 195deg);
  }
  #stage.show .spot { animation: spotOn 1.1s ease-out forwards; }
  @keyframes spotOn { 0% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: .35; } 60%, 100% { opacity: 1; } }

  .title { font-family: "Bebas Neue", sans-serif; color: var(--orange); font-size: clamp(34px, 9vw, 56px);
           line-height: 1; letter-spacing: .02em; position: relative; opacity: 0; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 8px 0 22px; position: relative; opacity: 0; }
  #certImg {
    width: min(960px, 100%); height: auto; display: block; position: relative; opacity: 0;
    box-shadow: 0 0 0 1px #2a2a2a, 0 25px 70px rgba(0,0,0,.8), 0 0 90px rgba(255,235,210,.12);
  }
  #stage.show .title { animation: rise .6s ease-out forwards .9s; }
  #stage.show .subtitle { animation: rise .6s ease-out forwards 1.05s; }
  #stage.show #certImg { animation: reveal 1s cubic-bezier(.2,.9,.3,1.05) forwards .45s; }
  #stage.show .actions, #stage.show .after { animation: rise .6s ease-out forwards 1.5s; }
  @keyframes reveal { from { opacity: 0; transform: perspective(900px) rotateX(14deg) scale(.82); filter: brightness(.3); }
                      to { opacity: 1; transform: none; filter: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; position: relative; opacity: 0; margin-top: 8px; }
  .actions .btn { width: auto; min-width: 200px; margin-top: 16px; }
  .after { position: relative; opacity: 0; }
  .tip { color: var(--muted); font-size: 12px; margin-top: 14px; }
  .edit { background: none; border: none; color: var(--muted); text-decoration: underline; font: 13px "Montserrat", sans-serif;
          margin-top: 12px; padding: 6px; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="glow" id="glow"></div>

<section id="welcome">
  <form class="card" id="nameForm" autocomplete="off">
    <img class="logo" src="logo.png" alt="The Brand Ambassador Program">
    <p class="congrats">Congrats,<br>Brand Ambassador!</p>
    <p class="lead">You've completed the program. Type your name below to get your Certificate of Mastery.</p>
    <label for="name">Your full name</label>
    <input id="name" type="text" maxlength="40" placeholder="Your Name" enterkeyhint="done">
    <p class="hint" id="hint"></p>
    <button class="btn" type="submit">Get my certificate</button>
  </form>
</section>

<section id="stage">
  <div class="spot"></div>
  <p class="title">Well done, <span id="firstName"></span>!</p>
  <p class="subtitle">Your Certificate of Mastery</p>
  <img id="certImg" alt="Your Brand Ambassador certificate">
  <div class="actions">
    <button class="btn" id="dlPdf">Download PDF</button>
    <button class="btn ghost" id="dlPng">Save as image</button>
  </div>
  <div class="after">
    <p class="tip">On a phone, you can also press and hold the certificate to save it.</p>
    <button class="edit" id="editBtn">Not quite right? Edit your name</button>
  </div>
</section>

<div class="bar"></div>
<canvas id="canvas" hidden></canvas>

<script>
  // Positions measured on the original certificate at 1308 x 924 units
  const REF_W = 1308;
  const NAME = { x: 654, baseline: 486, maxWidth: 560, size: 84, font: "Great Vibes" };
  const DATE = { x: 270, baseline: 796, size: 32 };

  const bg = new Image();
  bg.src = "certificate-bg.jpg";
  const bgReady = new Promise((res, rej) => { bg.onload = res; bg.onerror = rej; });

  const $ = id => document.getElementById(id);
  const canvas = $("canvas");
  let fileBase = "Certificate";

  const tidyName = raw => raw.trim().replace(/\s+/g, " ").split(" ")
    .map(w => w.charAt(0).toLocaleUpperCase() + w.slice(1)).join(" ");
  const monthYear = () => new Date().toLocaleString("en-US", { month: "long", year: "numeric" }).toUpperCase();

  async function drawCertificate(name) {
    await bgReady;
    await Promise.all([
      document.fonts.load(`${NAME.size}px "${NAME.font}"`, name),
      document.fonts.load(`700 ${DATE.size}px "Roboto"`, "NOVEMBER 2026")
    ]);
    canvas.width = bg.naturalWidth; canvas.height = bg.naturalHeight;
    const ctx = canvas.getContext("2d"), s = canvas.width / REF_W;
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";

    let size = NAME.size;
    const setFont = () => ctx.font = `${size}px "${NAME.font}", cursive`;
    setFont();
    while (ctx.measureText(name).width > NAME.maxWidth && size > 44) { size -= 2; setFont(); }
    ctx.fillText(name, NAME.x, NAME.baseline);

    ctx.font = `700 ${DATE.size}px "Roboto", Arial, sans-serif`;
    ctx.fillText(monthYear(), DATE.x, DATE.baseline);
    return canvas.toDataURL("image/jpeg", 0.95);
  }

  function celebrate() {
    if (typeof confetti !== "function" || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const colors = ["#fb5010", "#ffffff", "#ffb347", "#ff8a3d"];
    setTimeout(() => {
      confetti({ particleCount: 120, spread: 80, startVelocity: 48, origin: { y: .55 }, colors });
      const end = Date.now() + 1600;
      (function side() {
        confetti({ particleCount: 4, angle: 60, spread: 60, origin: { x: 0, y: .7 }, colors });
        confetti({ particleCount: 4, angle: 120, spread: 60, origin: { x: 1, y: .7 }, colors });
        if (Date.now() < end) requestAnimationFrame(side);
      })();
    }, 900);
  }

  $("nameForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = tidyName($("name").value);
    if (name.length < 2) { $("hint").textContent = "Please type your full name."; $("name").focus(); return; }
    $("hint").textContent = "";
    $("name").blur();
    try {
      $("certImg").src = await drawCertificate(name);
    } catch {
      $("hint").textContent = "Couldn't load the certificate. Please try again."; return;
    }
    $("firstName").textContent = name.split(" ")[0];
    fileBase = "Brand Ambassador Certificate - " + name;
    $("welcome").classList.add("leave");
    $("glow").style.display = "none";
    setTimeout(() => {
      $("welcome").style.display = "none";
      $("stage").classList.add("show");
      window.scrollTo(0, 0);
      celebrate();
    }, 420);
  });

  $("dlPng").addEventListener("click", () => {
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fileBase + ".png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, "image/png");
  });

  $("dlPdf").addEventListener("click", () => {
    const pdf = new window.jspdf.jsPDF({ orientation: "landscape", unit: "pt", format: "a4" });
    pdf.addImage(canvas.toDataURL("image/jpeg", .95), "JPEG", 0, 0,
      pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
    pdf.save(fileBase + ".pdf");
  });

  $("editBtn").addEventListener("click", () => {
    $("stage").classList.remove("show");
    $("welcome").style.display = ""; $("welcome").classList.remove("leave");
    $("glow").style.display = "";
    $("name").focus();
  });
</script>
</body>
</html>
